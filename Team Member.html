<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Planning Poker - Team Member</title>
  <style>
    .card { display:inline-block; margin:5px; padding:20px; border:1px solid #ccc; cursor:pointer; }
  </style>
</head>
<body>
  <h2>Planning Poker - Team Member</h2>
  <input id="room" placeholder="Room name" />
  <input id="name" placeholder="Your name" />
  <button id="join">Join Room</button>

  <div id="cards" style="margin-top:20px;">
    <div class="card">1</div>
    <div class="card">2</div>
    <div class="card">3</div>
    <div class="card">5</div>
    <div class="card">8</div>
    <div class="card">13</div>
    <div class="card">21</div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let room = "";

    document.getElementById('join').onclick = () => {
      room = document.getElementById('room').value.trim();
      const name = document.getElementById('name').value.trim();
      socket.emit('joinRoom', { room, name });
    };

    document.querySelectorAll('.card').forEach(card => {
      card.onclick = () => {
        if (room) socket.emit('submitEstimate', { room, value: card.textContent });
        alert("Your estimate is saved (hidden).");
      };
    });
  </script>
</body>
</html>
